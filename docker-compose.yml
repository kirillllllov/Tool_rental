services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: koptelovkir535363/tool-rental-app:latest   # ← добавили эту строку
    restart: unless-stopped
    volumes:
      - ./instance:/app/instance
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy